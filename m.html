<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🇬🇷Panagiotis🇬🇷</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Kanit', sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
    }

    body {
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      position: relative;
    }

    /* 📱  */
    .player-card {
      position: relative;
      z-index: 9999;
      width: 100%;
      max-width: 380px;
      height: 100%;
      background: linear-gradient(160deg, #0b132b 0%, #1c2541 100%); /* */
      border: 2px solid #00d2ff; /* */
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9),
                  0 0 20px rgba(0, 210, 255, 0.6),
                  inset 0 0 10px rgba(0, 210, 255, 0.3);
      display: flex;
      flex-direction: column;
      padding: 10px;
      overflow: hidden;
    }

    /* */
    .instagram-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      padding: 4px 10px;
      background: rgba(0, 210, 255, 0.08);
      border-radius: 12px;
      border: 1px solid rgba(0, 210, 255, 0.25);
    }

    .instagram-channel {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    /*  */
    .cyan-glow-text {
      color: #ffffff;
      text-shadow: 0 0 6px #00d2ff, 0 0 12px #00d2ff;
    }

    .instagram-icon {
      width: 22px;
      height: 22px;
      background: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: -2px -2px 6px #00d2ff, 2px 2px 6px #3a86ff;
      font-size: 11px;
      color: #fff;
    }

    /*  */
    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #00d2ff;
    }

    .live-tag {
      background: linear-gradient(45deg, #00d2ff, #3a86ff);
      color: #fff;
      padding: 2px 6px;
      border-radius: 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.8);
    }

    /*  */
    .song-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      border: 1px solid rgba(0, 210, 255, 0.2);
    }

    .song-info-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-logo {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #00d2ff;
      box-shadow: 0 0 6px rgba(0, 210, 255, 0.6);
    }

    .song-info h2 {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.2;
    }

    .song-info p {
      font-size: 10px;
      color: #8da9c4;
      font-weight: 500;
    }

    /* 📊  */
    .eq-container {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 16px;
    }

    .eq-bar {
      width: 3px;
      height: 100%;
      background: linear-gradient(to top, #3a86ff, #00d2ff);
      border-radius: 3px;
      transform-origin: bottom;
      transform: scaleY(0.2);
      transition: transform 0.2s ease;
    }

    .eq-container.playing .eq-bar:nth-child(1) { animation: eqBounce 0.6s infinite alternate ease-in-out; }
    .eq-container.playing .eq-bar:nth-child(2) { animation: eqBounce 0.4s infinite alternate ease-in-out 0.1s; }
    .eq-container.playing .eq-bar:nth-child(3) { animation: eqBounce 0.7s infinite alternate ease-in-out 0.2s; }
    .eq-container.playing .eq-bar:nth-child(4) { animation: eqBounce 0.5s infinite alternate ease-in-out 0.15s; }
    .eq-container.playing .eq-bar:nth-child(5) { animation: eqBounce 0.8s infinite alternate ease-in-out 0.05s; }

    @keyframes eqBounce {
      0% { transform: scaleY(0.15); }
      100% { transform: scaleY(1); }
    }

    /* 🕒 */
    .datetime-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .time-display {
      font-size: 12px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 0 6px #00d2ff;
      font-family: monospace;
    }

    .date-display {
      font-size: 9px;
      color: #8da9c4;
    }

    /* 🎬  */
    .video-display-area {
      flex: 1;
      position: relative;
      width: 100%;
      min-height: 0;
      border-radius: 14px;
      overflow: hidden;
      margin: 4px 0 8px 0;
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.8);
      background: #050508;
    }

    .video-display-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Controls บาร์ควบคุม */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(11, 19, 43, 0.85);
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: #8da9c4;
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 5px;
      accent-color: #00d2ff;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .btn-control {
      background: none;
      border: none;
      color: #d1d5db;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-control:hover {
      color: #00d2ff;
      transform: scale(1.15);
      text-shadow: 0 0 8px #00d2ff;
    }

    .btn-play {
      width: 36px;
      height: 36px;
      background: linear-gradient(45deg, #00d2ff, #3a86ff);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(0, 210, 255, 0.6);
    }

    .btn-play:hover {
      transform: scale(1.08);
      box-shadow: 0 4px 18px rgba(0, 210, 255, 0.9);
    }
#open-chat-btn { 
    color: #00ffcc !important; 
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.8); 
    transition: all 0.3s ease;
}
#open-chat-btn:hover { 
    color: #ffffff !important;
    text-shadow: 0 0 15px #00ffcc;
    transform: scale(1.1); 
}

  </style>
</head>
<body>

  <div class="player-card">
    
    <!--  -->
    <div class="instagram-badge">
      <div class="instagram-channel">
        <!-- 📸 ΤΟ ΝΕΟ ΖΩΝΤΑΝΟ LINK ΓΙΑ ΤΟ INSTAGRAM (ΑΝΟΙΓΕΙ ΣΕ ΞΕΧΩΡΙΣΤΗ ΣΕΛΙΔΑ) -->
      <p class="social-text">
        <a href="https://instagram.com" target="_blank" style="color: #ff007f; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s;">
                  <!-- ΤΟ ΕΙΚΟΝΙΔΙΟ ΤΟΥ INSTAGRAM ΜΕ ΣΤΡΟΓΓΥΛΟ CYAN-GLOW ΚΥΚΛΟ -->
        <i class="fab fa-instagram" style="font-size: 16px; color: #ff007f; background: rgba(0, 255, 204, 0.05); border: 2px solid #00ffcc; border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 0 12px  #00d2ff; inset 0 0 6px #00ffcc; transition: all 0.3s ease;"></i>

        </a>
      </p>
        <span class="cyan-glow-text">ᴾᵐPanagiotis🇬🇷</span>
      </div><!-- ΚΟΥΜΠΙ ΑΝΤΙΓΡΑΦΗΣ LINK ΓΙΑ ΚΟΙΝΟΠΟΙΗΣΗ 🔗 -->
      <center style="margin-top: 10px;">
        <button onclick="copyRadioLink()" title="Αντιγραφή Συνδέσμου" style="background: none; border: 1px solid var(--accent-color); color: var(--accent-color); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);"><i class="fas fa-copy"></i> <span id="share-btn-text">Share</span></button>
      </center>
      <div class="status-icons">
        <i class="fa-solid fa-signal"></i>
        <i class="fa-solid fa-wifi"></i>
        <i class="fa-solid fa-battery-full"></i>       

        <div class="live-tag">LIVE</div>
      </div>
    </div>

    <!--  -->
    <div class="song-header">
      <div class="song-info-container">
        <img src="https://xatimg.com/image/wN0GwHPQejWO.png" alt="Logo" class="custom-logo" id="song-logo">
        <div class="song-info">
          <h2 class="cyan-glow-text" id="song-title">ᴾᵐPanagiotis🇬🇷</h2>
          <p id="artist-name">ᴾᴶLadч Punᵏᵐ</p>
        </div>
      </div>

      <!--  -->
      <div class="eq-container" id="eq-visualizer">
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
        <div class="eq-bar"></div>
      </div>

      <!-- -->
      <div class="datetime-container">
        <div class="time-display" id="clock-time">00:00:00</div>
        <div class="date-display" id="clock-date">00/00/0000</div>
      </div>
    </div>

    <!-- 🎬  -->
        <div class="video-display-area" style="position: relative;">
      <!-- 1. Προσθέτουμε το poster="..." με το λινκ της φωτογραφίας σας -->
      <video id="bg-video" autoplay loop muted playsinline poster="https://xatimg.com/image/wN0GwHPQejWO.png" style="width: 100%; height: 100%; object-fit: cover;"></video>
 
<div id="mp3-cover-box" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; display: none; z-index: 2;"></div>
     
      <!-- 2. ΤΟ ΜΙΚΡΟ ΚΟΥΜΠΑΚΙ ΗΧΟΥ ΣΤΗΝ ΠΑΝΩ ΑΡΙΣΤΕΡΗ ΓΩΝΙΑ -->
      <button id="video-mute-btn" onclick="toggleVideoSound()" style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #00ffcc; border: 1px solid #00ffcc; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; font-size: 14px; transition: all 0.2s;"><i id="video-mute-icon" class="fas fa-volume-mute"></i></button>
   


<!-- ΤΟ ΚΡΥΦΟ ΠΛΑΙΣΙΟ ΤΟΥ CHAT ΜΕ ΑΔΕΙΑ ΜΙΚΡΟΦΩΝΟΥ 🎙️ -->
        <iframe id="embedded-chat" src="https://choises.github.io/t/tr" allow="microphone; microphone *" scrolling="no" style="display: block; width: 100%; height: 100%; min-height: 220px; max-height: 100%; border: none; border-radius: 10px; background: transparent; overflow: hidden; box-sizing: border-box; position: absolute; top: 0; left: 0; z-index: 3; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;"></iframe>






    </div>
    <!-- 🎶 ΤΟ ΚΡΥΦΟ ΠΛΑΙΣΙΟ ΤΗΣ ΛΙΣΤΑΣ ΤΡΑΓΟΥΔΙΩΝ ΜΕΣΑ ΣΤΟΝ PLAYER -->
    <div id="embedded-playlist" style="display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; border-radius: 10px; background: rgba(20, 24, 31, 0.65); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; padding: 15px; overflow-y: auto; z-index: 9999; border: 1px solid rgba(255, 255, 255, 0.05);">
           <!-- Ο ΤΙΤΛΟΣ ΜΑΖΙ ΜΕ ΤΟ ΚΟΚΚΙΝΟ ΚΟΥΜΠΙ ΚΛΕΙΣΙΜΑΤΟΣ (X) -->
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c3545; padding-bottom: 5px; margin-bottom: 15px;">
        <span style="color: #00ffcc; font-size: 16px; font-weight: bold;">🎵 Λίστα Τραγουδιών</span>
        <button onclick="closePlaylistAndReturn()" style="background: #c0392b; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">X</button>

      </div>

      
           <!-- Τα τραγούδια της λίστας συνδεδεμένα με τον μηχανισμό on-demand -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="playlist-item-btn" onclick="playOnDemand(0)" style="background: #1e2530; color: #fff; border: 1px solid #2c3545; padding: 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; transition: background 0.2s;">🎵 Τραγούδι 1 - Καλλιτέχνης 1 (MP3)</button>
        <button class="playlist-item-btn" onclick="playOnDemand(1)" style="background: #1e2530; color: #fff; border: 1px solid #2c3545; padding: 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; transition: background 0.2s;">🎵 Τραγούδι 2 - Καλλιτέχνης 2 (MP3)</button>
        <button class="playlist-item-btn" onclick="playOnDemand(2)" style="background: #1e2530; color: #fff; border: 1px solid #2c3545; padding: 10px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; transition: background 0.2s;">🎬 Βίντεο Κλιπ Δοκιμή (MP4)</button>
      </div>

    </div>

    <!-- Controls -->
    <div class="controls">
      
<!-- ΝΕΑ ΜΠΑΡΑ ΕΝΤΑΣΗΣ ΗΧΟΥ 🔊 -->
<div class="volume-container" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin: 15px 0;">
    <i class="fas fa-volume-down" style="color: #00ffcc; text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);"></i>
    <!-- value="0.5" σημαίνει έναρξη ακριβώς στο 50% -->
    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="0.5" style="width: 100px; accent-color: #00ffcc; cursor: pointer;">
    <i class="fas fa-volume-up" style="color: #00ffcc; text-shadow: 0 0 5px rgba(0, 255, 204, 0.5);"></i>
</div>

      <div class="buttons" style="position: relative; display: flex; justify-content: center; align-items: center; margin: -15px auto; width: 100%; min-height: 0px;">
        
<button class="control-btn" id="prev-track" onclick="togglePlaylistView()" title="Λίστα Τραγουδιών" style="position: absolute; left: 10px; border: none; background: none; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.8); cursor: pointer;"><i class="fas fa-list" style="font-size: 20px;"></i></button>

        <button class="btn-control btn-play" id="play-btn"><i class="fa-solid fa-play" id="play-icon"></i></button>
        <button class="btn-control" id="next-track" title="Choices"><i class=""></i></button>
 <button class="control-btn" id="open-chat-btn" onclick="toggleChatView()" title="Live Chat" style="position: absolute; right: 10px; border: none; background: none; color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.8); cursor: pointer;"><i class="far fa-comment" style="font-size: 20px;"></i></button>
    

      </div>
    </div>

  </div>

  <audio id="audio-player"></audio>

  <script>
    const tracksData = [
      {
        title: "ᴾᵐPanagiotis🇬🇷",
        artist: "Online Radio",
        audioSrc: "https://stream.rcast.net/200586"
      }
    ];

    let currentTrackIndex = 0;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const eqVisualizer = document.getElementById('eq-visualizer');

    const songTitle = document.getElementById('song-title');
    const artistName = document.getElementById('artist-name');

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();

      document.getElementById('clock-time').innerText = `${hours}:${minutes}:${seconds}`;
      document.getElementById('clock-date').innerText = `${day}/${month}/${year}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracksData[currentTrackIndex];

      songTitle.innerText = track.title;
      artistName.innerText = track.artist;
      audio.src = track.audioSrc;
    }

    audio.addEventListener('timeupdate', () => {
      const currentTime = audio.currentTime;
      if (audio.duration) {
        progress.value = (currentTime / audio.duration) * 100 || 0;
        durationEl.innerText = formatTime(audio.duration);
      } else {
        progress.value = 100;
        durationEl.innerText = "LIVE";
      }
      currentTimeEl.innerText = formatTime(currentTime);
    });

    // ΖΩΝΤΑΝΗ ΡΟΗ: Φορτώνει πάντα το "Τώρα" χωρίς να κρατάει παλιά μνήμη!
    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        const track = tracksData[currentTrackIndex];
        audio.src = track.audioSrc;
        audio.load();
        
        audio.play().catch(err => console.log("Χρειάζεται κλικ:", err));
        playIcon.className = 'fa-solid fa-pause';
        if (eqVisualizer) eqVisualizer.classList.add('playing');
      } else {
        audio.pause();
        audio.src = ""; 
        
        playIcon.className = 'fa-solid fa-play';
        if (eqVisualizer) eqVisualizer.classList.remove('playing');
      }
    });

    document.getElementById('next-track').addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracksData.length;
      loadTrack(currentTrackIndex);
      audio.play();
      playIcon.className = 'fa-solid fa-pause';
      eqVisualizer.classList.add('playing');
    });

    document.getElementById('prev-track').addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracksData.length) % tracksData.length;
      loadTrack(currentTrackIndex);
      audio.play();
      playIcon.className = 'fa-solid fa-pause';
      eqVisualizer.classList.add('playing');
    });

    loadTrack(0);

       // 💬 Εναλλαγή Οθόνης Chat με έλεγχο Opacity για να μην πέφτει μαύρο στο Live Βίντεο!
    function toggleChatView() {
        const chatFrame = document.getElementById('embedded-chat');
        const playlistPanel = document.getElementById('embedded-playlist');

        if (!chatFrame) return;

        if (chatFrame.style.opacity === "0" || chatFrame.style.opacity === "") {
            chatFrame.style.opacity = "1";
            chatFrame.style.pointerEvents = "auto"; 
            if (playlistPanel) playlistPanel.style.display = 'none';
            document.getElementById('open-chat-btn').innerHTML = '<i class="fas fa-music"></i>';
        } else {
            chatFrame.style.opacity = "0";
            chatFrame.style.pointerEvents = "none"; 
            document.getElementById('open-chat-btn').innerHTML = '<i class="far fa-comment"></i>';
        }
    }

    const volumeBar = document.getElementById('volume-bar');

    if (audio) {
        audio.volume = 0.5;
    }

    if (volumeBar) {
        volumeBar.addEventListener('input', (e) => {
            if (audio) { audio.volume = e.target.value; }
        });
    }

    // 📺 Ο ΜΗΧΑΝΙΣΜΟΣ ΠΟΥ ΠΑΙΖΕΙ ΚΑΙ .M3U8 ΚΑΙ .MP4 ΒΙΝΤΕΟ!
    const videoElement = document.getElementById('bg-video');
    const videoSource = "https://eco.streams.ovh:8081/barazatv/index.m3u8"; 
    let hls = null;

    function initHLS() {
      if (videoElement) {
        if (videoSource.endsWith('.m3u8')) {
          if (typeof Hls !== 'undefined' && Hls.isSupported()) {
            hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 60, maxBufferSize: 30 * 1000 * 1000, enableWorker: true, lowLatencyMode: false });
            hls.loadSource(videoSource); hls.attachMedia(videoElement);
          } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
            videoElement.src = videoSource;
          }
        } else {
          videoElement.src = videoSource;
        }
      }
    }
    initHLS();

    function toggleVideoSound() {
        const vid = document.getElementById('bg-video');
        const muteIcon = document.getElementById('video-mute-icon');
        if (vid) {
            if (vid.muted) { vid.muted = false; muteIcon.className = "fas fa-volume-up"; } 
            else { vid.muted = true; muteIcon.className = "fas fa-volume-mute"; }
        }
    }

    // 🎶 Ανοιγοκλείσιμο Λίστας Τραγουδιών (ΜΟΝΟ ΜΙΑ ΦΟΡΑ ΟΡΙΣΜΕΝΗ!)
    function togglePlaylistView() {
      const playlistPanel = document.getElementById('embedded-playlist');
      const chatFrame = document.getElementById('embedded-chat');

      if (!playlistPanel) return;

      if (playlistPanel.style.display === 'none' || playlistPanel.style.display === '') {
        playlistPanel.style.display = 'block';
        if (videoElement) videoElement.style.display = 'none';
        if (chatFrame) {
            chatFrame.style.opacity = "0";
            chatFrame.style.pointerEvents = "none";
        }
      } else {
        playlistPanel.style.display = 'none';
        if (videoElement) videoElement.style.display = 'block';
        returnToLiveStream();
      }
    }

    // ⚡ Ο ΜΗΧΑΝΙΣΜΟΣ ΠΟΥ ΠΑΙΖΕΙ ΚΑΙ .MP3 ΚΑΙ .MP4 ON-DEMAND
    function playOnDemand(index) {
        const track = onDemandTracks[index];
        if (!track) return;

        audio.pause(); audio.src = ""; isPlaying = false;
        document.getElementById('play-icon').className = "fas fa-play";
        document.getElementById('song-title').innerText = track.title;
        document.getElementById('artist-name').innerText = track.artist;

        if (hls) { hls.detachMedia(); }

        const coverBox = document.getElementById('mp3-cover-box');

        if (track.isTextOnly) {
          audio.src = track.fileUrl; audio.load(); audio.play().catch(e => console.log(e));
          if (coverBox && track.coverUrl) {
            coverBox.style.backgroundImage = `url('${track.coverUrl}')`;
            coverBox.style.display = 'block';
          }
          if (videoElement && videoSource.endsWith('.m3u8')) { initHLS(); }
        } else {
          if (coverBox) coverBox.style.display = 'none'; 
          if (videoElement) {
            videoElement.style.display = 'block';
            videoElement.src = track.fileUrl; videoElement.load(); videoElement.muted = false;
            videoElement.play().catch(e => console.log(e));
            document.getElementById('video-mute-icon').className = "fas fa-volume-up";
            videoElement.addEventListener('ended', returnToLiveStream, { once: true });
          }
        }
        const playlistPanel = document.getElementById('embedded-playlist');
        if (playlistPanel) playlistPanel.style.display = 'none';
        if (videoElement && track.isTextOnly) videoElement.style.display = 'block';
    }

    function closePlaylistAndReturn() {
      togglePlaylistView(); 
      returnToLiveStream(); 
    }

    function returnToLiveStream() {
        document.getElementById('song-title').innerText = "📻 Panagiotis Live";
        document.getElementById('artist-name').innerText = "PM Panagiotis & PJ Lady Punk";

        const coverBox = document.getElementById('mp3-cover-box');
        if (coverBox) coverBox.style.display = 'none';

        if (videoElement) {
          videoElement.style.display = 'block';
          videoElement.muted = true;
          document.getElementById('video-mute-icon').className = "fas fa-volume-mute";
          initHLS();
          videoElement.play().catch(e => console.log(e));
        }

        audio.src = 'https://stream.rcast.net/200586'; audio.load(); audio.play();
        document.getElementById('play-icon').className = "fas fa-pause";
        isPlaying = true;
    }

    function copyRadioLink() {
      const currentLink = window.location.href;
      const btnText = document.getElementById('share-btn-text');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentLink).then(() => { showSuccessMessage(btnText); }).catch(() => { fallbackCopy(currentLink, btnText); });
      } else { fallbackCopy(currentLink, btnText); }
    }

    function fallbackCopy(text, element) {
      const textArea = document.createElement("textarea");
      textArea.value = text; textArea.style.position = "fixed"; document.body.appendChild(textArea);
      textArea.focus(); textArea.select();
      try { document.execCommand('copy'); showSuccessMessage(element); } catch (err) {}
      document.body.removeChild(textArea);
    }

    function showSuccessMessage(element) {
      if (element) { element.innerText = "Αντιγράφηκε! ✅"; setTimeout(() => { element.innerText = "Share"; }, 2000); }
    }
</script>
